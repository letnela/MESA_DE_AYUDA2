spring.application.name=sistema-tickets

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ticket_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ticket123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

gemini.api.key=${GEMINI_API_KEY:sin-configurar}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE